<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rogue — production forecast</title>
    <meta name="description" content="Enter a real sea state (Hs, Tp, γ) and get a physical NLS-based blow-up and rogue-wave forecast. Deterministic, reproducible, dimensionality-correct, running in your browser." />
    <link rel="canonical" href="https://rogue.jesed.dev/production.html" />
    <link rel="icon" href="/waves-white.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; --bg:#06070b; --panel:#11131b; --accent:#3db8ff; --warn:#ffb03d; --danger:#ff5d5d; --text:#e8eaf0; --muted:#8b90a0; }
      * { box-sizing:border-box; }
      html, body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:13px/1.45 "IBM Plex Sans","Segoe UI",system-ui,sans-serif; }
      .wrap { max-width:920px; margin:0 auto; padding:28px 20px; }
      h1 { font-size:20px; letter-spacing:.04em; }
      h1 span { color:var(--accent); }
      .muted { color:var(--muted); font-size:12px; }
      .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:18px 0; }
      label { display:flex; flex-direction:column; gap:6px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
      input, button, select { font:inherit; color:var(--text); background:#1a1d28; border:1px solid #2a2f40; border-radius:6px; padding:10px 12px; }
      input { width:100%; }
      button { cursor:pointer; background:linear-gradient(180deg,#2a3144,#1c2030); }
      button.primary { background:linear-gradient(180deg,#5cc2ff,#1f7fd0); color:#05121f; border:none; font-weight:700; }
      button:hover { border-color:var(--accent); }
      .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-top:8px; }
      .card { background:var(--panel); border:1px solid #1e2230; border-radius:10px; padding:16px; }
      .card .k { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
      .card .v { font-size:22px; margin-top:4px; font-variant-numeric:tabular-nums; }
      .card.sev { border-color:var(--danger); } .card.hi { border-color:#ff9b3d; } .card.elev { border-color:var(--gold); } .card.low { border-color:#2f9e5f; }
      .ev { background:#0d1018; border:1px solid #222838; border-radius:8px; padding:10px 14px; margin:6px 0; font-family:ui-monospace,monospace; font-size:13px; color:#c8d0e0; }
      .ev b { color:#fff; }
      pre { background:#0d1018; border:1px solid #222838; border-radius:8px; padding:14px; overflow:auto; font-size:12px; max-height:320px; }
      a.back { color:var(--accent); text-decoration:none; font-size:13px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="back" href="/">← home</a>
      <h1>ROGUE <span>production</span> forecast</h1>
      <div class="muted">Enter a real sea state → live physical NLS forecast</div>

      <div class="grid">
        <label>Hs — significant height [m] <input id="hs" type="number" step="0.1" value="4.0" /></label>
        <label>Tp — peak period [s] <input id="tp" type="number" step="0.1" value="11.0" /></label>
        <label>γ — JONSWAP peak <input id="gamma" type="number" step="0.1" value="3.3" /></label>
      </div>
      <button id="run" class="primary">Run forecast</button>

      <div id="cards" class="cards"></div>
      <div id="events" style="margin-top:18px"></div>
      <div id="json" style="margin-top:18px"></div>
      <div id="status" class="muted" style="margin:14px 0">loading wasm…</div>
    </div>
    <script type="module" src="/src/production.ts"></script>
  </body>
</html>
